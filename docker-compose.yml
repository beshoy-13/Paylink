services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: paylink
      POSTGRES_PASSWORD: ${DB_PASSWORD:-paylink_dev}
      POSTGRES_DB: paylink
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paylink"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: >-
        Host=db;Database=paylink;Username=paylink;Password=${DB_PASSWORD:-paylink_dev}
    ports:
      - "8080:8080"
volumes:
  pgdata:
